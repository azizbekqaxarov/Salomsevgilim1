<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sojida uchun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff1ee; --ink:#3a1830; --muted:#8a5a6e; --rose:#d94f70; --card:#ffffff; --line:#f1c9d1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#241028;--ink:#ffe9ee;--muted:#d6a3b6;--rose:#ff7f9f;--card:#331640;--line:#5a2f63;}
}
:root[data-theme="dark"]{--bg:#241028;--ink:#ffe9ee;--muted:#d6a3b6;--rose:#ff7f9f;--card:#331640;--line:#5a2f63;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:28px}
.screen.on{display:flex}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.05;margin:0;font-size:clamp(2.6rem,13vw,5rem)}
h1 b{color:var(--rose)}
.q{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.3;max-width:560px;margin:0}
.btn{font:inherit;font-weight:700;font-size:1.15rem;border:0;border-radius:999px;padding:16px 38px;cursor:pointer;background:var(--rose);color:#fff;touch-action:manipulation}
.btn.no{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:60px}
.no.run{position:fixed;z-index:10;transition:left .18s ease,top .18s ease}
.love{font-size:clamp(2.4rem,11vw,4.4rem)}
.fly{position:fixed;bottom:10%;font-size:28px;color:var(--rose);pointer-events:none;animation:up 2.6s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-70vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.fly{animation:none;opacity:0}.no.run{transition:none}}
</style>
</head>
<body>

<div class="screen on" id="s1">
  <h1>Salom <b>SOJIDA</b></h1>
  <button class="btn" id="hello">Salom</button>
</div>

<div class="screen" id="s2">
  <p class="q">Hozir do‘stmizmi yoki boshqami, lekin men sizni haligacha sevaman. Keling, hammasini boshidan boshlaymiz.</p>
  <div class="row" id="row">
    <button class="btn" id="yes">Ha</button>
    <button class="btn no" id="no">Yo‘q</button>
  </div>
</div>

<div class="screen" id="s3">
  <p class="q">Javobingiz uchun rahmat</p>
  <h1 class="love"><b>MEN SIZNI SEVAMAN</b></h1>
</div>

<script>
(function(){
  function show(id){
    ['s1','s2','s3'].forEach(function(s){document.getElementById(s).classList.toggle('on',s===id)});
  }
  document.getElementById('hello').onclick=function(){show('s2')};

  var no=document.getElementById('no');
  function run(e){
    if(e){e.preventDefault();e.stopPropagation();}
    no.classList.add('run');
    var w=no.offsetWidth,h=no.offsetHeight;
    var x=8+Math.random()*(window.innerWidth-w-16);
    var y=8+Math.random()*(window.innerHeight-h-16);
    no.style.left=Math.max(8,x)+'px';
    no.style.top=Math.max(8,y)+'px';
  }
  ['pointerenter','pointerdown','touchstart','mouseover','click','focus'].forEach(function(ev){
    no.addEventListener(ev,run,{passive:false});
  });

  document.getElementById('yes').onclick=function(){
    show('s3');
    for(var k=0;k<20;k++){
      var h=document.createElement('span');
      h.className='fly';h.textContent='♥';
      h.style.left=(Math.random()*92)+'%';
      h.style.fontSize=(20+Math.random()*28)+'px';
      h.style.animationDelay=(k*0.1)+'s';
      document.body.appendChild(h);
      setTimeout(function(x){x.remove()},4500,h);
    }
  };
})();
</script>
</body>
</html>
